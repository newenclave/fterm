[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
arboard = "3.6"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
etagere = "0.3"
notify = "8.2"
mlua = { version = "0.12", features = ["luau", "vendored"] }
open = "5"
pollster = "1"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tracing = "0.1"
unicode-width = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30"
winit = "0.30.13"

# Our own crates.
fterm-config = { path = "crates/fterm-config" }
fterm-mux = { path = "crates/fterm-mux" }
fterm-render = { path = "crates/fterm-render" }
fterm-term = { path = "crates/fterm-term" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
