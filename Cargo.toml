[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
arboard = "3.6"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
etagere = "0.3"
interprocess = "2.4"
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }
notify = "8.2"
notify-rust = "4.17"
sys-locale = "0.3"
mlua = { version = "0.12", features = ["luau", "vendored", "serde"] }
open = "5"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tracing = "0.1"
unicode-width = "0.2"
ureq = { version = "3.4", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
widestring = "1"
wgpu = "30"
winit = "0.30.13"

# Our own crates.
fterm-ai = { path = "crates/fterm-ai" }
fterm-api = { path = "crates/fterm-api" }
fterm-config = { path = "crates/fterm-config" }
fterm-history = { path = "crates/fterm-history" }
fterm-scene = { path = "crates/fterm-scene" }
fterm-mux = { path = "crates/fterm-mux" }
fterm-render = { path = "crates/fterm-render" }
fterm-term = { path = "crates/fterm-term" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
